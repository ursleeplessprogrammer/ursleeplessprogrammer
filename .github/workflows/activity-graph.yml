
name: Update Contribution Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-graph
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ==========================================
      # 2. GENERATE CONTRIBUTION DASHBOARD
      # ==========================================
      - name: Generate contribution dashboard
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const username = 'ursleeplessprogrammer';

            const query = `
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              login: username
            });

            const calendar =
              result.user.contributionsCollection
                .contributionCalendar;

            const weeks = calendar.weeks;
            const days = weeks.flatMap(
              week => week.contributionDays
            );

            if (!days.length) {
              throw new Error('No contribution data returned.');
            }

            // ======================================
            // DASHBOARD CONFIGURATION
            // ======================================

            const width = 1000;
            const height = 390;

            const background = '#1f1f23';
            const panel = '#29292f';
            const border = '#45454d';

            const textPrimary = '#f0f0f2';
            const textSecondary = '#a1a1aa';

            const inactive = '#e6e8eb';

            const levels = [
              inactive,
              '#0e4429',
              '#006d32',
              '#26a641',
              '#39d353'
            ];

            // ======================================
            // CONTRIBUTION STATISTICS
            // ======================================

            const total = calendar.totalContributions;

            const bestDay = days.reduce(
              (best, day) =>
                day.contributionCount > best.contributionCount
                  ? day
                  : best,
              days[0]
            );

            const average = (
              total / days.length
            ).toFixed(2);

            const formatDate = date =>
              new Date(date + 'T00:00:00Z')
                .toLocaleDateString('en-US', {
                  month: 'short',
                  day: 'numeric',
                  year: 'numeric',
                  timeZone: 'UTC'
                });

            const firstDate = days[0].date;
            const lastDate = days[days.length - 1].date;

            // ======================================
            // CALCULATE STREAKS
            // ======================================

            let longestStreak = 0;
            let runningStreak = 0;

            for (const day of days) {
              if (day.contributionCount > 0) {
                runningStreak++;
                longestStreak = Math.max(
                  longestStreak,
                  runningStreak
                );
              } else {
                runningStreak = 0;
              }
            }

            let currentStreak = 0;
            let streakIndex = days.length - 1;

            // If there are no contributions today,
            // start checking from yesterday.
            if (
              days[streakIndex].contributionCount === 0
            ) {
              streakIndex--;
            }

            while (
              streakIndex >= 0 &&
              days[streakIndex].contributionCount > 0
            ) {
              currentStreak++;
              streakIndex--;
            }

            // ======================================
            // HEATMAP LAYOUT
            // ======================================

            const cellSize = 12;
            const gap = 5;

            const gridX = 58;
            const gridY = 115;

            const step = cellSize + gap;

            const gridHeight =
              7 * cellSize + 6 * gap;

            // Determine contribution intensity.
            const maxContribution = Math.max(
              1,
              ...days.map(d => d.contributionCount)
            );

            function getLevel(count) {
              if (count === 0) return 0;

              const ratio = count / maxContribution;

              if (ratio <= 0.25) return 1;
              if (ratio <= 0.50) return 2;
              if (ratio <= 0.75) return 3;

              return 4;
            }

            // Map contribution dates to their SVG positions.
            let cells = '';
            let monthLabels = '';

            weeks.forEach((week, weekIndex) => {
              const x = gridX + weekIndex * step;

              week.contributionDays.forEach(day => {
                const date = new Date(
                  day.date + 'T00:00:00Z'
                );

                // JavaScript Sunday = 0.
                // Convert to Monday = 0.
                const weekday = (
                  date.getUTCDay() + 6
                ) % 7;

                const y = gridY + weekday * step;

                const level = getLevel(
                  day.contributionCount
                );

                const color = levels[level];

                cells += `
                  <rect
                    x="${x}"
                    y="${y}"
                    width="${cellSize}"
                    height="${cellSize}"
                    rx="2.5"
                    fill="${color}">
                    <title>
                      ${day.contributionCount} contributions on ${day.date}
                    </title>
                  </rect>
                `;
              });

              // Display month labels at the first
              // occurrence of each month.
              const firstDay = week.contributionDays[0];

              if (firstDay) {
                const date = new Date(
                  firstDay.date + 'T00:00:00Z'
                );

                const month = date.getUTCMonth();

                if (
                  weekIndex === 0 ||
                  month !== new Date(
                    weeks[weekIndex - 1]
                      .contributionDays[0]
                      .date + 'T00:00:00Z'
                  ).getUTCMonth()
                ) {
                  const label = date.toLocaleString(
                    'en-US',
                    {
                      month: 'short',
                      timeZone: 'UTC'
                    }
                  );

                  monthLabels += `
                    <text
                      x="${x}"
                      y="99"
                      fill="${textSecondary}"
                      font-size="12">
                      ${label}
                    </text>
                  `;
                }
              }
            });

            // ======================================
            // WEEKDAY LABELS
            // ======================================

            const weekdayLabels = [
              { label: 'Mon', row: 0 },
              { label: 'Wed', row: 2 },
              { label: 'Fri', row: 4 }
            ];

            let weekdayText = '';

            weekdayLabels.forEach(item => {
              weekdayText += `
                <text
                  x="35"
                  y="${gridY + item.row * step + 10}"
                  fill="${textSecondary}"
                  font-size="11"
                  text-anchor="middle">
                  ${item.label}
                </text>
              `;
            });

            // ======================================
            // SVG HELPERS
            // ======================================

            function svgText(
              x,
              y,
              value,
              size = 13,
              color = textPrimary,
              weight = 400
            ) {
              return `
                <text
                  x="${x}"
                  y="${y}"
                  fill="${color}"
                  font-size="${size}"
                  font-weight="${weight}">
                  ${value}
                </text>
              `;
            }

            // ======================================
            // CONTRIBUTION STATISTICS CARD
            // ======================================

            const contributionCard = `
              <rect
                x="58"
                y="260"
                width="520"
                height="105"
                rx="15"
                fill="${panel}"
                stroke="${border}"
                stroke-width="1.2"
              />

              ${svgText(
                78, 283, 'Contributions', 16, textPrimary, 600
              )}

              ${svgText(
                78, 306, 'Total in the last year', 12, textPrimary, 600
              )}

              ${svgText(
                78, 333, total.toLocaleString('en-US'), 23, textPrimary, 700
              )}

              ${svgText(
                78, 352,
                `${formatDate(firstDate)} → ${formatDate(lastDate)}`,
                10, textSecondary
              )}

              ${svgText(
                255, 306, 'Best day', 12, textPrimary, 600
              )}

              ${svgText(
                255, 333,
                bestDay.contributionCount.toString(),
                23, '#39d353', 700
              )}

              ${svgText(
                255, 352,
                formatDate(bestDay.date),
                10, textSecondary
              )}

              ${svgText(
                420, 306, 'Average', 12, textPrimary, 600
              )}

              ${svgText(
                420, 333, average, 23, '#39d353', 700
              )}

              ${svgText(
                474, 333, '/ day', 12, textSecondary
              )}
            `;

            // ======================================
            // STREAK STATISTICS CARD
            // ======================================

            const streakCard = `
              <rect
                x="600"
                y="260"
                width="342"
                height="105"
                rx="15"
                fill="${panel}"
                stroke="${border}"
                stroke-width="1.2"
              />

              ${svgText(
                620, 283, 'Streaks', 16, textPrimary, 600
              )}

              ${svgText(
                620, 306, 'Longest streak', 12, textPrimary, 600
              )}

              ${svgText(
                620, 333,
                `${longestStreak} days`,
                23, '#39d353', 700
              )}

              ${svgText(
                620, 352,
                'Consecutive active days',
                10, textSecondary
              )}

              ${svgText(
                790, 306, 'Current streak', 12, textPrimary, 600
              )}

              ${svgText(
                790, 333,
                `${currentStreak} days`,
                23, '#39d353', 700
              )}

              ${svgText(
                790, 352,
                'Consecutive active days',
                10, textSecondary
              )}
            `;

            // ======================================
            // FINAL SVG DASHBOARD
            // ======================================

            const svg = `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="${width}"
              height="${height}"
              viewBox="0 0 ${width} ${height}"
              fill="none">

              <rect
                width="${width}"
                height="${height}"
                rx="18"
                fill="${background}"
                stroke="${border}"
                stroke-width="1"
              />

              <!-- Header -->
              <circle
                cx="65"
                cy="53"
                r="20"
                fill="#30363d"
                stroke="${border}"
              />

              <text
                x="65"
                y="59"
                font-size="20"
                text-anchor="middle"
                fill="${textPrimary}">
                &lt;/&gt;
              </text>

              ${svgText(
                100, 48, username, 17, textPrimary, 700
              )}

              ${svgText(
                100, 68,
                'GitHub Contribution Dashboard',
                12, textSecondary
              )}

              <!-- Pro-style label -->
              <rect
                x="890"
                y="35"
                width="55"
                height="24"
                rx="12"
                fill="#e6e6eb"
              />

              <text
                x="917.5"
                y="51"
                font-size="11"
                font-weight="700"
                text-anchor="middle"
                fill="#25252a">
                GITHUB
              </text>

              <!-- Contribution calendar -->
              ${monthLabels}
              ${weekdayText}
              ${cells}

              <!-- Statistics -->
              ${contributionCard}
              ${streakCard}

            </svg>
            `;

            // Save generated SVG.
            fs.mkdirSync('profile', {
              recursive: true
            });

            fs.writeFileSync(
              'profile/activity.svg',
              svg.trim()
            );

            console.log('Dashboard generated successfully.');
            console.log(`Total contributions: ${total}`);
            console.log(`Longest streak: ${longestStreak}`);
            console.log(`Current streak: ${currentStreak}`);

      # ==========================================
      # 3. COMMIT AND PUSH
      # ==========================================
      - name: Commit and synchronize dashboard
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/activity.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update contribution dashboard"

          MAX_RETRIES=3

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt of $MAX_RETRIES"

            git fetch origin main

            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Dashboard successfully updated!"
              exit 0
            fi

            echo "Push failed. Retrying..."

            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              sleep 3
            fi
          done

          echo "ERROR: Could not push dashboard."
          exit 1
