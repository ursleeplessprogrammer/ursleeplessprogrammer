
name: Update Contribution Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity graph
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const username = 'ursleeplessprogrammer';

            const query = `
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              login: username
            });

            const calendar =
              result.user.contributionsCollection.contributionCalendar;

            const days = calendar.weeks.flatMap(
              week => week.contributionDays
            );

            const width = 1000;
            const height = 320;

            const margin = {
              top: 35,
              right: 35,
              bottom: 55,
              left: 55
            };

            const chartWidth =
              width - margin.left - margin.right;

            const chartHeight =
              height - margin.top - margin.bottom;

            const maxValue = Math.max(
              4,
              Math.ceil(
                Math.max(...days.map(d => d.contributionCount)) / 4
              ) * 4
            );

            const x = i =>
              margin.left +
              (i / Math.max(days.length - 1, 1)) * chartWidth;

            const y = value =>
              margin.top +
              chartHeight -
              (value / maxValue) * chartHeight;

            const points = days.map((day, i) => ({
              x: x(i),
              y: y(day.contributionCount),
              date: day.date,
              count: day.contributionCount
            }));

            const linePath = points.map((p, i) =>
              `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`
            ).join(' ');

            const areaPath = `
              ${linePath}
              L ${points[points.length - 1].x} ${margin.top + chartHeight}
              L ${points[0].x} ${margin.top + chartHeight}
              Z
            `;

            const gridCount = 4;
            let grid = '';
            let labels = '';

            for (let i = 0; i <= gridCount; i++) {
              const value = (maxValue / gridCount) * i;
              const yy = y(value);

              grid += `
                <line
                  x1="${margin.left}"
                  y1="${yy}"
                  x2="${width - margin.right}"
                  y2="${yy}"
                  stroke="#30363d"
                  stroke-dasharray="4 5"
                  opacity="0.8"
                />
              `;

              labels += `
                <text
                  x="${margin.left - 12}"
                  y="${yy + 4}"
                  fill="#8b949e"
                  font-size="11"
                  text-anchor="end"
                >${Math.round(value)}</text>
              `;
            }

            let dateLabels = '';

            const monthPositions = new Map();

            points.forEach((p, i) => {
              const date = new Date(p.date + 'T00:00:00Z');

              if (date.getUTCDate() === 1 || i === 0) {
                monthPositions.set(
                  date.toLocaleString('en-US', {
                    month: 'short',
                    timeZone: 'UTC'
                  }),
                  p.x
                );
              }
            });

            for (const [month, position] of monthPositions) {
              dateLabels += `
                <text
                  x="${position}"
                  y="${height - 20}"
                  fill="#8b949e"
                  font-size="11"
                  text-anchor="middle"
                >${month}</text>
              `;
            }

            const last = points[points.length - 1];

            const svg = `
            <svg xmlns="http://www.w3.org/2000/svg"
              width="${width}"
              height="${height}"
              viewBox="0 0 ${width} ${height}"
              fill="none">

              <defs>
                <linearGradient
                  id="areaGradient"
                  x1="0" y1="0"
                  x2="0" y2="1">
                  <stop offset="0%"
                    stop-color="#58a6ff"
                    stop-opacity="0.35"/>
                  <stop offset="100%"
                    stop-color="#58a6ff"
                    stop-opacity="0.01"/>
                </linearGradient>
              </defs>

              <rect
                width="${width}"
                height="${height}"
                rx="12"
                fill="#0d1117"
              />

              <text
                x="${margin.left}"
                y="22"
                fill="#c9d1d9"
                font-size="13"
                font-weight="600"
              >Contribution Activity</text>

              ${grid}
              ${labels}

              <path
                d="${areaPath}"
                fill="url(#areaGradient)"
              />

              <path
                d="${linePath}"
                stroke="#58a6ff"
                stroke-width="2.5"
                stroke-linejoin="round"
                stroke-linecap="round"
              />

              <circle
                cx="${last.x}"
                cy="${last.y}"
                r="4"
                fill="#58a6ff"
                stroke="#0d1117"
                stroke-width="2"
              />

              ${dateLabels}

              <text
                x="${width - margin.right}"
                y="22"
                fill="#8b949e"
                font-size="11"
                text-anchor="end"
              >${calendar.totalContributions} contributions</text>

            </svg>
            `;

            fs.mkdirSync('profile', { recursive: true });

            fs.writeFileSync(
              'profile/activity.svg',
              svg.trim()
            );

      - name: Commit activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/activity.svg

          git commit -m "Update contribution activity graph" || exit 0

          git push
